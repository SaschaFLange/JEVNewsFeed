<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Triager</title>
  <!-- Tailwind CSS via CDN for rapid Figma-like styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Top Bar Navigation -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">HackerNews & Jev AI Triager</h1>
        <p class="text-xs text-slate-400 mt-1">Python FastAPI + Jev Decision Model Backend</p>
      </div>
      <button onclick="fetchFeed()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2.5 rounded-lg shadow-sm transition-all">
        Reload Live Feed
      </button>
    </header>

    <!-- Main Content List -->
    <main id="feed-container" class="space-y-4">
      <div class="text-center py-12 text-slate-500 text-sm">
        Click <strong class="text-slate-400">Reload Live Feed</strong> to fetch articles from your Python backend.
      </div>
    </main>

  </div>

  <script>
    const BACKEND_URL = "http://127.0.0.1:8000";

    // Step 1: Call Python Endpoint (/api/feed)
    async function fetchFeed() {
      const container = document.getElementById('feed-container');
      container.innerHTML = `<div class="text-center py-12 text-indigo-400 animate-pulse">Fetching feed from FastAPI backend...</div>`;

      try {
        const response = await fetch(`${BACKEND_URL}/api/feed`);
        const data = await response.json();

        container.innerHTML = '';

        data.stories.forEach(story => {
          const card = document.createElement('div');
          card.className = "bg-slate-800 border border-slate-700/60 rounded-xl p-5 shadow-md transition-all space-y-3";
          
          card.innerHTML = `
            <div class="flex justify-between items-start gap-4">
              <div class="space-y-1">
                <span class="text-[10px] font-mono tracking-wider uppercase px-2 py-0.5 bg-slate-700 text-slate-300 rounded">
                  Author: ${story.author} • Points: ${story.points}
                </span>
                <h2 class="text-base font-semibold text-white">
                  <a href="${story.url}" target="_blank" class="hover:text-indigo-400 transition-colors">${story.title}</a>
                </h2>
              </div>
              
              <button onclick="analyzeStory('${story.id}', \`${escapeHtml(story.title)}\`)" 
                      class="shrink-0 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-2 rounded-md transition-colors">
                Run Jev AI
              </button>
            </div>

            <!-- Analysis Card Output -->
            <div id="analysis-${story.id}" class="hidden p-4 bg-slate-900 border border-slate-700/80 rounded-lg text-xs font-mono space-y-2">
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<div class="text-center py-12 text-rose-400">Error connecting to Python backend: ${err.message}</div>`;
      }
    }

    function escapeHtml(text) {
      return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Step 2: Call Python Endpoint (/api/analyze)
    async function analyzeStory(id, title) {
      const outputDiv = document.getElementById(`analysis-${id}`);
      outputDiv.classList.remove('hidden');
      outputDiv.innerHTML = `<span class="text-amber-400 animate-pulse">Sending title to Jev AI Decision engine...</span>`;

      try {
        const response = await fetch(`${BACKEND_URL}/api/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title })
        });

        const data = await response.json();
        const decisions = data.decisions;

        outputDiv.innerHTML = `
          <div class="text-emerald-400 font-bold mb-2">✓ Jev AI Decision Results:</div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-slate-300">
            <div class="bg-slate-800 p-2 rounded border border-slate-700">
              <span class="text-slate-500 block">Category (Choice):</span>
              <strong class="text-indigo-300">${decisions.category.value}</strong> 
              <span class="text-[10px] text-slate-500">(${Math.round(decisions.category.probability * 100)}% prob)</span>
            </div>
            <div class="bg-slate-800 p-2 rounded border border-slate-700">
              <span class="text-slate-500 block">Hype Score (1-10):</span>
              <strong class="text-purple-300">${decisions.hype_level.score}</strong>
            </div>
            <div class="bg-slate-800 p-2 rounded border border-slate-700">
              <span class="text-slate-500 block">Actionable Dev Item:</span>
              <strong class="${decisions.actionable.is_actionable ? 'text-emerald-400' : 'text-slate-400'}">
                ${decisions.actionable.is_actionable ? 'Yes' : 'No'}
              </strong>
            </div>
          </div>
        `;
      } catch (err) {
        outputDiv.innerHTML = `<span class="text-rose-400">Analysis failed: ${err.message}</span>`;
      }
    }
  </script>
</body>
</html>
